<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#150A11">
</head><body>
<title>타로포</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500;700&display=swap">

<style>
/* ============================================================
   TOKENS — 앱 단일 테마. 폰 화면은 원래도 고정 다크 오브젝트였고,
   이 빌드는 페이지 전체가 그 오브젝트뿐이라 호스트 테마를 따르지 않는다.
   ============================================================ */
:root{
  /* brand — 소스와 동일 */
  --ink:#1B0E16;
  --plum:#4F0720;
  --plum2:#2C0F1D;
  --rose:#F9236C;
  --blush:#FFC9DB;
  --cream:#FFF4F8;
  --gilt:#D9A94B;
  --gilt-dim:#8A6B2E;
  --bezel:#090407;
  --bezel-hi:#4A3140;

  /* ground — 폰이 놓이는 바닥 한 색 */
  --bg:#150A11;
  --fg:#F6E9F0;
  --rose-ink:#FF6C9C;
  --phone-shadow:0 2px 8px rgba(0,0,0,.5), 0 46px 100px -34px rgba(0,0,0,.8);

  /* type */
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --disp:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;height:100%;min-height:100dvh;overflow:hidden;
  background:var(--bg);
  background-image:
    radial-gradient(76% 50% at 50% 6%, rgba(79,7,32,.62), transparent 68%),
    radial-gradient(58% 40% at 50% 100%, rgba(44,15,29,.72), transparent 74%);
  background-attachment:fixed;
  color:var(--fg);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--serif);font-weight:700;letter-spacing:-.01em}

/* 한글은 어절 단위로 끊는다(keep-all). 일본어는 공백이 없어 normal 이어야 넘치지 않음. */
#app{word-break:keep-all;overflow-wrap:break-word}
#app [lang="ja"]{word-break:normal;overflow-wrap:normal;line-break:normal}
p{margin:0}
img{max-width:100%;display:block}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--rose-ink)}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:3px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}

/* language font swap — only inside regions that actually switch */
#app[data-lang="ja"] .ja-swap{
  --serif:"Noto Serif JP","Hiragino Mincho ProN",Georgia,serif;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}

/* ============================================================
   SHELL — 앱 껍데기
   (a) 모바일(≤480px): 베젤 없이 화면이 뷰포트를 채운다. 페이지 스크롤 없음.
   (b) 데스크톱: 조용한 자두빛 바닥 한가운데 베젤 폰. 세로도 가운데,
       창이 낮으면 기존 auto-scale 이 폰을 줄여서 맞춘다.
   ============================================================ */
#app{
  min-height:100dvh;padding:16px;
  display:flex;align-items:center;justify-content:center;
}
.stage{width:100%;display:flex;justify-content:center;isolation:isolate}
.phone-scale{transform-origin:top center}

/* 언어 토글 — 두 모드 모두 우상단 고정. 자두빛 반투명 알약. */
.langpill{
  position:fixed;z-index:60;top:16px;right:16px;
  display:flex;gap:2px;padding:3px;border-radius:999px;
  background:rgba(44,15,29,.66);
  border:1px solid rgba(217,169,75,.26);
  -webkit-backdrop-filter:blur(10px) saturate(1.25);
  backdrop-filter:blur(10px) saturate(1.25);
  box-shadow:0 1px 2px rgba(0,0,0,.34), 0 10px 26px -14px rgba(0,0,0,.72);
}
.seg-btn{
  font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.12em;
  line-height:1;padding:6px 13px;border-radius:999px;
  color:rgba(255,201,219,.6);
  transition:color .18s ease, background .18s ease;
}
.seg-btn:hover{color:var(--blush)}
.seg-btn.is-on{background:var(--plum);color:var(--cream)}

/* ---- device ---- */
.phone{
  width:390px;height:844px;border-radius:44px;
  background:linear-gradient(160deg,#241520,var(--bezel) 42%,#160C13);
  padding:10px;position:relative;
  box-shadow:var(--phone-shadow), inset 0 0 0 1px var(--bezel-hi);
}
.phone::after{
  content:"";position:absolute;inset:3px;border-radius:41px;
  border:1px solid rgba(255,201,219,.08);pointer-events:none;
}
.screen{
  position:relative;width:370px;height:824px;border-radius:34px;overflow:hidden;
  background:var(--ink);color:var(--cream);
  display:flex;flex-direction:column;
  font-family:var(--sans);line-height:1.65;
}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(120% 60% at 50% -8%, rgba(249,35,108,.16), transparent 58%);
}
.notch{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);
  width:112px;height:30px;border-radius:16px;background:#050205;z-index:8;
}

.statusbar{
  height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.06em;
  color:var(--blush);position:relative;z-index:9;
}
.sb-time{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums lining-nums}
.sb-right{display:flex;align-items:center;gap:5px}
.sb-bar{width:3px;background:var(--blush);border-radius:1px;opacity:.75}
.sb-batt{width:20px;height:10px;border:1px solid var(--blush);border-radius:3px;opacity:.75;position:relative}
.sb-batt::after{content:"";position:absolute;inset:2px;right:6px;background:var(--blush);border-radius:1px}

.appbar{
  flex:none;padding:2px 24px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:1px solid rgba(217,169,75,.16);position:relative;z-index:6;
}
.appbar-t{font-family:var(--serif);font-weight:500;font-size:15px;letter-spacing:.02em;color:var(--cream)}
.appbar-d{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.05em;color:var(--gilt);font-variant-numeric:tabular-nums}

.views{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;position:relative;z-index:6}
.views::-webkit-scrollbar{display:none}
.v{padding:22px 24px 34px;min-height:100%;display:flex;flex-direction:column;animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---- entry ----
   점술사 타로포 — 래스터(민무늬 세포) 1장 + 금박 라인 의상 2겹(뒤/앞).
   셋 다 .teller-in 한 덩어리 안에 있으므로 모자·링·수정구가 몸과 같이 둥실거린다.
   원본 래스터는 회전·변형하지 않는다 — 의상은 전부 오버레이 라인이다.
   좌표계: 200×200 박스. 래스터는 (25,34)에 150px. 실측 실루엣 — 정수리 y=43,
   발끝 y=174(높이 131), 최대폭 y=126 에서 113(x 43~156), 중심선 x=100. */
.v-entry{align-items:center;justify-content:center;gap:0;text-align:center}
.teller{position:relative;width:200px;height:200px;margin-bottom:2px}
.teller-in{position:absolute;inset:0}
.teller-in::before{
  content:"";position:absolute;z-index:0;left:50%;top:112px;
  width:186px;height:186px;margin:-93px 0 0 -93px;border-radius:50%;
  background:radial-gradient(circle, rgba(217,169,75,.22), transparent 68%);
}
.teller-in::after{
  content:"";position:absolute;z-index:0;left:50%;top:174px;
  width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
  background:radial-gradient(circle, rgba(249,35,108,.2), transparent 70%);
}
.tl-line{position:absolute;left:0;top:0;width:200px;height:200px;overflow:visible;color:var(--gilt);pointer-events:none}
.tl-back{z-index:1}
.tl-front{z-index:3}
.sepo{
  position:absolute;z-index:2;left:25px;top:34px;width:150px;height:150px;
  object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.42))
}
.float{animation:float 4.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

.bubble{
  position:relative;background:var(--plum2);border:1px solid rgba(217,169,75,.28);
  border-radius:16px;padding:14px 18px;color:var(--cream);font-size:14.5px;line-height:1.78;
  box-shadow:0 8px 22px rgba(0,0,0,.3);
}
.bubble-c{max-width:262px;margin-top:10px}
.bubble-c::before{
  content:"";position:absolute;top:-7px;left:50%;margin-left:-7px;width:12px;height:12px;
  background:var(--plum2);border-left:1px solid rgba(217,169,75,.28);border-top:1px solid rgba(217,169,75,.28);
  transform:rotate(45deg);
}
.entry-btns{display:flex;flex-direction:column;gap:11px;width:100%;margin-top:32px}
.entry-foot{margin-top:18px;font-size:11.5px;letter-spacing:.02em;color:rgba(255,201,219,.6)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  border-radius:14px;padding:15px 18px;font-size:15px;font-weight:700;
  transition:transform .16s ease, filter .16s ease, background .16s ease;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--rose);color:#fff;box-shadow:0 10px 26px -8px rgba(249,35,108,.7)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,201,219,.07);color:var(--blush);border:1px solid rgba(255,201,219,.24)}
.btn.ghost:hover{background:rgba(255,201,219,.13)}
.btn.sm{padding:11px 14px;font-size:13.5px;border-radius:11px}
.btn.gilt{background:transparent;color:var(--gilt);border:1px solid rgba(217,169,75,.45)}
.btn.gilt:hover{background:rgba(217,169,75,.12)}

/* ---- browse carousel ---- */
.v-browse{position:relative;align-items:center;justify-content:flex-start;gap:0;padding-top:18px}
.bz-slots{display:flex;gap:16px;justify-content:center;flex:none}
.bz-slot{display:flex;flex-direction:column;align-items:center;gap:8px;width:54px}
.bz-slot-in{
  width:54px;height:85px;border-radius:8px;display:grid;place-items:center;
  border:1px dashed rgba(217,169,75,.34);background:rgba(255,201,219,.035);
  transition:border-color .2s ease, background .2s ease;
}
.bz-slot.is-now .bz-slot-in{border-color:var(--rose);background:rgba(249,35,108,.1)}
.bz-slot.is-on .bz-slot-in{border:0;background:none}
.bz-slot-in .cardback{width:54px;height:85px;border-radius:8px}
.bz-slot-in .cardback .sigil{width:24px;height:24px}
.bz-slot-num{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1;color:rgba(217,169,75,.45)}
.bz-slot-lab{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.06em;color:rgba(255,201,219,.55);white-space:nowrap}
.bz-slot.is-now .bz-slot-lab{color:var(--rose)}
.bz-slot.is-on .bz-slot-lab{color:var(--gilt)}

.bz-head{margin-top:22px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bz-title{font-family:var(--serif);font-weight:500;font-size:17.5px;line-height:1.4;color:var(--cream)}
.bz-title em{font-style:normal;color:var(--rose)}
.bz-hint{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--gilt)}

/* full-bleed inside the 24px screen padding so neighbours peek off both edges */
.bz-stage{position:relative;align-self:stretch;height:288px;margin:16px -24px 0;overflow:hidden;flex:none}
.bz-track{position:absolute;inset:0}
.bz-cell{
  position:absolute;left:50%;top:50%;width:132px;height:208px;margin:-104px 0 0 -66px;
  transform-origin:50% 62%;pointer-events:none;will-change:transform,opacity;
  transition:transform 280ms cubic-bezier(.22,.61,.36,1), opacity 280ms ease;
}
.bz-cell .cardback{width:100%;height:100%;border-radius:12px}
.bz-cell .cardback .sigil{width:46px;height:46px}
.bz-cell.is-focus .cardback{animation:sway 5.4s ease-in-out infinite}
/* 이미 뽑힌 자리 — 부채에서 빠지고 다시 고를 수 없다 */
.bz-cell.is-gone{opacity:0;pointer-events:none}
.bz-stage.is-lift .bz-cell.is-focus .cardback{box-shadow:inset 0 0 0 5px rgba(0,0,0,.18), inset 0 0 0 6px rgba(217,169,75,.55), 0 20px 34px rgba(0,0,0,.52)}
.bz-zone{position:absolute;top:0;bottom:0;width:34%;z-index:12}
.bz-zone.left{left:0}
.bz-zone.right{right:0}
.bz-zone::after{
  content:"";position:absolute;top:50%;width:10px;height:10px;
  border-top:1.5px solid rgba(255,201,219,.42);border-right:1.5px solid rgba(255,201,219,.42);
  transition:border-color .18s ease;
}
.bz-zone.left::after{left:15px;transform:translateY(-50%) rotate(-135deg)}
.bz-zone.right::after{right:15px;transform:translateY(-50%) rotate(45deg)}
.bz-zone:hover::after{border-color:var(--rose)}
.bz-pick{position:absolute;left:50%;top:50%;width:132px;height:208px;margin:-104px 0 0 -66px;z-index:15;border-radius:12px}
.bz-fly{position:absolute;z-index:30;pointer-events:none;transition:transform 420ms cubic-bezier(.3,.75,.3,1), opacity 420ms ease}
.bz-fly .cardback{width:100%;height:100%;border-radius:12px}
.bz-foot{margin-top:16px;text-align:center;font-size:11.5px;line-height:1.7;color:rgba(255,201,219,.55);white-space:pre-line}

.cardback{
  width:100%;height:100%;border-radius:11px;position:relative;display:grid;place-items:center;
  border:1px solid var(--gilt-dim);
  background:
    repeating-linear-gradient(45deg, transparent 0 10px, rgba(217,169,75,.10) 10px 11px),
    repeating-linear-gradient(-45deg, transparent 0 10px, rgba(217,169,75,.10) 10px 11px),
    radial-gradient(120% 92% at 50% 0%, #6A1230 0%, var(--plum) 52%, #340615 100%);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.18), inset 0 0 0 6px rgba(217,169,75,.34), 0 12px 26px rgba(0,0,0,.42);
  transition:box-shadow .2s ease;
}
@keyframes sway{0%,100%{transform:rotate(-1.1deg) translateY(0)}50%{transform:rotate(1.1deg) translateY(-5px)}}
.cardback .sigil{width:52px;height:52px;color:var(--gilt);opacity:.85}

/* ---- card face ---- */
.fulldeck{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));
  gap:22px 14px;justify-items:center;margin-top:6px;
}
.cardface{
  --cw:214px;
  width:var(--cw);height:calc(var(--cw) * 1.575);
  border-radius:calc(var(--cw) * .052);
  background:linear-gradient(168deg,#5C0C28 0%, var(--plum) 46%, #2E0715 100%);
  border:1px solid var(--gilt-dim);
  box-shadow:0 14px 34px rgba(0,0,0,.46);
  padding:calc(var(--cw) * .055);
  position:relative;overflow:hidden;
}
.cardface::before{
  content:"";position:absolute;inset:calc(var(--cw) * .042);
  border:1px solid rgba(217,169,75,.5);border-radius:calc(var(--cw) * .03);pointer-events:none;
}
.cardface::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 44% at 50% 32%, rgba(217,169,75,.16), transparent 70%);
}
.cf-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--cw) * .055) 0}
.cf-num{
  font-family:var(--disp);font-weight:600;color:var(--gilt);
  font-size:calc(var(--cw) * .1);letter-spacing:.18em;line-height:1;
}
.cf-motif{color:var(--gilt);width:calc(var(--cw) * .5);height:calc(var(--cw) * .5);transition:transform .3s ease}
.cardface[data-rev="1"] .cf-motif{transform:rotate(180deg)}
.cf-foot{display:flex;flex-direction:column;align-items:center;gap:calc(var(--cw) * .03);width:100%;padding-inline:calc(var(--cw)*.06)}
.cf-name{
  font-family:var(--serif);font-weight:500;color:var(--cream);
  font-size:calc(var(--cw) * .088);line-height:1.3;text-align:center;letter-spacing:.01em;
}
.cf-badge{
  font-family:var(--sans);font-weight:500;font-size:calc(var(--cw) * .056);
  letter-spacing:.16em;color:var(--gilt);
}
.cardface[data-rev="1"] .cf-badge{color:var(--blush)}

/* --- art face — 갤러리 카드의 장식(2중 금박선·코너 플뢰롱·로마자 카르투슈·이름 배너)을
   그대로 폰 화면 크기로 옮긴 것. 장면 데이터(SCENE)와 세포 래스터는 갤러리와 공유한다. --- */
.cardface.art .cf-in{justify-content:flex-start;padding:calc(var(--cw)*.03) 0 calc(var(--cw)*.035)}
.cf-cnr{
  position:absolute;z-index:3;width:calc(var(--cw)*.019);height:calc(var(--cw)*.019);
  background:var(--gilt);opacity:.72;transform:rotate(45deg);
}
.cf-cnr.tl{left:calc(var(--cw)*.032);top:calc(var(--cw)*.032)}
.cf-cnr.tr{right:calc(var(--cw)*.032);top:calc(var(--cw)*.032)}
.cf-cnr.bl{left:calc(var(--cw)*.032);bottom:calc(var(--cw)*.032)}
.cf-cnr.br{right:calc(var(--cw)*.032);bottom:calc(var(--cw)*.032)}
.cardface.art .cf-num{
  flex:none;display:flex;align-items:center;justify-content:center;gap:calc(var(--cw)*.028);
  min-width:calc(var(--cw)*.26);border:1px solid rgba(217,169,75,.52);border-radius:2px;
  background:rgba(9,4,7,.42);padding:calc(var(--cw)*.009) calc(var(--cw)*.045);
  font-size:calc(var(--cw)*.072);line-height:1.5;
}
.cardface.art .cf-num b{font-weight:600}
.cardface.art .cf-num i{
  flex:none;width:calc(var(--cw)*.014);height:calc(var(--cw)*.014);
  background:var(--gilt);opacity:.7;transform:rotate(45deg);
}

/* 장면 상자. SVG 는 폭 기준으로 그려 세로로 넘치게 두는데, 그래야 갤러리와 같은
   비율로 앉고 좌우 한두 획이 안쪽 금박선을 넘어간다(카드가 대신 잘라낸다). */
.cf-scene{position:relative;flex:1;width:100%;min-height:0;margin-top:calc(var(--cw)*.036)}
.cf-glow{
  position:absolute;left:50%;top:50%;z-index:0;width:92%;aspect-ratio:1;
  transform:translate(-50%,calc(-50% + var(--sy,0px)));
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, var(--glow,rgba(217,169,75,.13)) 0%, transparent 66%);
}
.cf-art{
  position:absolute;left:0;top:50%;z-index:1;width:100%;height:auto;aspect-ratio:200 / 256;
  transform:translateY(-50%);overflow:visible;color:var(--gilt);opacity:.9;
}
.cf-sepo{
  position:absolute;left:50%;top:50%;z-index:2;width:64%;height:auto;aspect-ratio:1;
  transform:translate(-50%,calc(-50% + var(--sy,0px)));
  object-fit:contain;filter:drop-shadow(0 8px 14px rgba(9,4,7,.5));
  animation:acfloat 3.4s ease-in-out infinite;
}
/* XIX 거꾸로 보기 — 래스터 자체를 180° 돌린다. 덱에서 유일하게 허용된 회전. */
.cf-sepo.flip{
  transform:translate(-50%,calc(-50% + var(--sy,0px))) rotate(180deg);
  animation-name:acfloatflip;
}
@keyframes acfloatflip{
  0%,100%{transform:translate(-50%,calc(-50% + var(--sy,0px))) rotate(180deg)}
  50%{transform:translate(-50%,calc(-50% + var(--sy,0px) - 6px)) rotate(180deg)}
}
.cf-prop{position:absolute;z-index:2;object-fit:contain;filter:drop-shadow(0 5px 9px rgba(9,4,7,.45))}
.cf-scene::after{
  content:"";position:absolute;inset:calc(var(--cw) * -.11);z-index:3;pointer-events:none;
  background:radial-gradient(70% 62% at 50% 44%, transparent 56%, rgba(9,4,7,var(--vig,.24)) 100%);
}
.cardface.art .cf-foot{
  position:relative;z-index:4;margin-top:calc(var(--cw)*.028);padding-top:calc(var(--cw)*.05);
  border-top:1px solid rgba(217,169,75,.3);gap:calc(var(--cw)*.018);
}
/* 150px 아래에서는 잔디테일이 노이즈가 된다 — 구도는 두고 세부만 덜어낸다. */
.cardface.lod-s .cf-art .dt{display:none}
.cardface.lod-s .cf-art{opacity:.86}

/* ---- reveal ---- */
.v-reveal{align-items:center;justify-content:center;gap:26px}
.reveal-stage{display:flex;flex-direction:column;align-items:center}
.reveal-row{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-start;gap:10px}
.rv-col{display:flex;flex-direction:column;align-items:center;gap:9px}
.rv-pos{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.12em;color:var(--gilt)}

/* 들여다보는 타로포 — 뒷면이 깔린 뒤 첫 플립 전까지 카드 뒤에서 카드를 살핀다.
   진입 화면과 같은 덩어리(래스터 1장 + 금박 라인 2겹)를 그대로 축소해 쓴다:
   의상과 몸이 한 상자 안에 있으므로 scale 하나로 비율이 어긋나지 않는다. */
.rv-teller{position:relative;z-index:0;flex:none;width:122px;height:122px;margin-bottom:-12px}
.rv-teller-sc{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;transform:scale(.61)}
.rv-teller .teller{margin:0}
@keyframes rvpeer{
  0%,100%{transform:rotate(-3.6deg)}
  50%{transform:rotate(3.6deg)}
}
.rv-teller.is-peer .teller{animation:rvpeer 1.15s ease-in-out infinite;transform-origin:50% 82%}
/* 생각 방울은 살피는 동안에만 있는 소품이다 — 기본 상태는 없음(가라앉은 뒤 사라진다). */
.rv-think{
  position:absolute;left:calc(50% + 30px);top:0;z-index:2;opacity:0;transition:opacity 260ms ease;
  font-family:var(--serif);font-weight:500;font-size:12.5px;letter-spacing:.04em;color:var(--cream);
  background:var(--plum2);border:1px solid rgba(217,169,75,.28);border-radius:12px;
  padding:5px 11px;box-shadow:0 6px 16px rgba(0,0,0,.34);white-space:nowrap;
}
.rv-teller.is-peer .rv-think{opacity:1;animation:rvthink 1.15s ease-in-out infinite}
@keyframes rvthink{0%,100%{opacity:.5}50%{opacity:1}}

.flipwrap{perspective:1200px}
.flipper{position:relative;transform-style:preserve-3d;transition:transform 600ms cubic-bezier(.2,.75,.2,1)}
.flipper.is-flipped{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{position:absolute;inset:0;transform:rotateY(180deg)}
.face .cardback{animation:none}
.face .cardback:hover{transform:none}

/* ---- reading ---- */
.v-reading{gap:18px}
.cf-badge-out{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt)}
.rd-say{display:flex;align-items:flex-start;gap:10px}
.sepo-sm{width:78px;height:78px;flex:none;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.bubble-l{flex:1}
.bubble-l::before{
  content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;
  background:var(--plum2);border-left:1px solid rgba(217,169,75,.28);border-bottom:1px solid rgba(217,169,75,.28);
  transform:rotate(45deg);
}
.caret{display:inline-block;width:2px;height:1em;background:var(--rose);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.is-done .caret{display:none}

.rd-blocks{display:flex;flex-direction:column;gap:14px}
.rd-block{display:flex;gap:13px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid rgba(217,169,75,.14)}
.rd-block:last-child{border-bottom:0;padding-bottom:0}
.rd-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rd-pos{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--gilt)}
.rd-name{font-family:var(--serif);font-weight:500;font-size:15px;color:var(--cream);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rd-dir{font-family:var(--sans);font-size:11px;letter-spacing:.12em;color:var(--gilt);font-weight:500}
.rd-dir.rev{color:var(--blush)}
.rd-text{font-size:13.5px;line-height:1.8;color:rgba(255,244,248,.86)}

/* 자리 블록에는 행동 문장을 두지 않는다 — 하루의 행동은 종합의 "한 걸음" 하나뿐이다(v6.2). */

/* ---- quintessence ---- */
.rd-div{display:flex;align-items:center;gap:11px;margin-top:6px}
.rd-div::before,.rd-div::after{content:"";flex:1;height:1px;background:rgba(217,169,75,.26)}
.rd-div-ico{width:22px;height:22px;flex:none;object-fit:contain;opacity:.9}
.rd-div span{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--gilt);white-space:nowrap}
.quint{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.quint-weather{
  display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:3px 8px;max-width:30ch;
  padding:10px 16px;border:1px solid rgba(217,169,75,.34);border-radius:12px;
  background:linear-gradient(180deg, rgba(217,169,75,.10), rgba(217,169,75,.03));
}
.qw-lab{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--gilt);white-space:nowrap}
.qw-dash{color:rgba(217,169,75,.6);font-size:13px}
.qw-txt{font-family:var(--serif);font-weight:500;font-size:16.5px;line-height:1.45;color:var(--cream)}
/* 리더의 말 — 오늘의 종합에서 가장 큰 문장. 타이핑되는 노드라 빈 상태에서도 자리를 잡아 둔다. */
.quint-reader{
  font-family:var(--serif);font-weight:500;font-size:15.5px;line-height:1.85;
  color:var(--cream);max-width:32ch;min-height:1.85em;text-align:center;
}
/* 문장을 기다리는 동안의 숨결 — 자리만 지킨다. 첫 글자가 오면 클래스가 떨어진다. */
.quint-reader.is-weaving{color:rgba(255,201,219,.62);animation:weave 1600ms ease-in-out infinite}
@keyframes weave{0%,100%{opacity:.5}50%{opacity:.9}}
.quint .cardface{box-shadow:0 16px 40px rgba(0,0,0,.5), 0 0 30px -6px rgba(217,169,75,.6)}
.quint .cardface::before{border-color:rgba(217,169,75,.8)}
.quint-axis{
  font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--gilt);
  border:1px solid rgba(217,169,75,.4);border-radius:999px;padding:6px 14px;
}
.quint-text{max-width:31ch}
/* 오늘의 한 걸음 — 화면에 남은 유일한 행동 문장이라 장미빛 상자로 따로 세운다.
   날씨 칩(금박)과 색을 갈라 두 개가 같은 무게로 읽히지 않게 한다. */
.quint-step{
  width:100%;max-width:31ch;display:flex;flex-direction:column;align-items:center;gap:6px;
  margin-top:2px;padding:13px 16px;border-radius:14px;
  border:1px solid rgba(249,35,108,.36);
  background:linear-gradient(180deg, rgba(249,35,108,.13), rgba(249,35,108,.04));
}
.qs-lab{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--rose)}
.qs-txt{font-family:var(--serif);font-weight:500;font-size:15px;line-height:1.6;color:var(--cream)}
/* 여운 한 줄 — 리딩의 마지막. 라벨도 상자도 없이 조용히 닫는다. */
.rd-glow{margin-top:18px;max-width:29ch;font-size:12px;line-height:1.9;color:rgba(255,201,219,.6)}
.rd-relock{margin-top:14px;text-align:center;font-size:11.5px;line-height:1.7;color:rgba(255,201,219,.5)}

/* ---- 공개 페이싱 (v6.2) ----
   갤러리 아트와 같은 규칙이다: 최종 상태가 기본이고, 연출 클래스는 스크립트가
   걸었다가 뗀다. 스크립트가 돌지 않거나 탭이 뒤로 숨겨져 키프레임이 멈춰도
   화면에는 전부 보이는 상태만 남는다. 마크업에는 --sd(시작 지연)만 실려 있고,
   그 값은 클래스가 붙기 전까지 아무 일도 하지 않는다. */
.sq-off{opacity:0;pointer-events:none}
.sq-rise{animation:rise 300ms cubic-bezier(.22,.75,.3,1) var(--sd,0ms) both}
.sq-in{animation:sqin 300ms ease both}
@keyframes sqin{from{opacity:0}to{opacity:1}}
/* 퀸트 카드 등장 — 스케일과 금박 글로우. 0%/100% 는 카드의 평상시 그림자와
   같은 값이라, 클래스를 떼는 순간에 번쩍임이 없다. */
.quint .cardface.sq-pop{animation:sqpop 400ms cubic-bezier(.22,.75,.3,1) both}
@keyframes sqpop{
  0%{opacity:0;transform:scale(.94);box-shadow:0 16px 40px rgba(0,0,0,.5), 0 0 30px -6px rgba(217,169,75,.6)}
  55%{opacity:1;box-shadow:0 16px 40px rgba(0,0,0,.5), 0 0 46px 2px rgba(217,169,75,.95)}
  100%{opacity:1;transform:none;box-shadow:0 16px 40px rgba(0,0,0,.5), 0 0 30px -6px rgba(217,169,75,.6)}
}
/* 스킵 — 남은 플립은 전환 없이 그 자리에서 앞면이 된다. */
.v-reveal.is-skip .flipper{transition:none}
/* 세 번째 카드가 안착한 뒤의 마무리 — 자리 칩 세 개가 한 번 빛나고, 부채는 잠긴다. */
.v-browse.is-seal .bz-stage{pointer-events:none}
.bz-slots.is-seal .bz-slot-in{animation:bzseal 500ms ease both}
@keyframes bzseal{
  0%{box-shadow:0 0 0 0 rgba(217,169,75,0)}
  45%{box-shadow:0 0 18px 3px rgba(217,169,75,.5)}
  100%{box-shadow:0 0 0 0 rgba(217,169,75,0)}
}
/* .v 의 rise 애니메이션이 opacity 를 채우고 있어 transition 은 먹지 않는다 —
   같은 층위(애니메이션)로 덮어써서 페이드아웃한다. */
.v-browse.is-fade{animation:bzfade 280ms ease forwards}
@keyframes bzfade{from{opacity:1}to{opacity:0}}

/* ---- story composer ---- */
.v-story{gap:14px;align-items:center}
.st-head{flex:none;display:flex;flex-direction:column;gap:5px;text-align:center}
.st-title{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--cream)}
.st-sub{font-size:12px;line-height:1.6;color:rgba(255,201,219,.6)}
.st-frame{
  width:232px;height:412px;flex:none;position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(168deg,#5C0C28 0%, var(--plum) 44%, #240510 100%);
  border:1px solid var(--gilt-dim);box-shadow:0 18px 40px rgba(0,0,0,.5);
}
.st-frame::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(74% 42% at 50% 26%, rgba(217,169,75,.18), transparent 70%);
}
.st-fr-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;padding:18px 18px 16px}
.st-fr-top{width:100%;display:flex;align-items:baseline;justify-content:space-between}
.st-fr-num{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.16em;line-height:1;color:var(--gilt)}
.st-fr-dir{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.12em;color:rgba(255,201,219,.7)}
.st-fr-art{--cw:150px;flex:none;width:150px;height:192px;margin-top:6px}
.st-fr-art::after{inset:-46px -44px}
.st-fr-lab{margin-top:11px;font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.16em;color:var(--gilt);text-align:center}
.st-fr-name{margin-top:7px;font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.35;color:var(--cream);text-align:center}
.st-fr-cap{
  width:100%;margin-top:12px;padding-top:12px;border-top:1px solid rgba(217,169,75,.3);
  font-family:var(--serif);font-size:14.5px;line-height:1.72;color:rgba(255,244,248,.92);
  text-align:center;min-height:2em;overflow-wrap:break-word;
}
.st-fr-mark{margin-top:auto;font-family:var(--sans);font-size:10px;letter-spacing:.12em;color:rgba(255,201,219,.42);font-variant-numeric:tabular-nums}
.st-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;flex:none}
.st-chip{
  font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.02em;
  border:1px solid rgba(255,201,219,.24);border-radius:999px;padding:7px 14px;color:var(--blush);
  transition:background .16s ease, color .16s ease, border-color .16s ease;
}
.st-chip:hover{background:rgba(255,201,219,.1)}
.st-chip.is-on{background:var(--rose);border-color:transparent;color:#fff}
.st-cap{
  width:100%;flex:none;border:1px solid rgba(217,169,75,.32);border-radius:12px;
  background:rgba(255,201,219,.05);color:var(--cream);padding:11px 13px;
  font-size:13.5px;line-height:1.65;resize:none;
}
.st-cap:focus{border-color:var(--rose);outline:none}
.st-cap::placeholder{color:rgba(255,201,219,.4)}
.st-posted{display:flex;flex-direction:column;align-items:center;gap:13px}
.st-badge{
  font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--gilt);
  border:1px solid rgba(217,169,75,.45);border-radius:999px;padding:6px 14px;
}
.v-story .rd-actions{width:100%;margin-top:auto;padding-top:6px}
.v-story.is-posted .rd-actions{margin-top:26px}
.rd-actions{display:flex;gap:9px;margin-top:2px}
.rd-actions .btn{flex:1}
.tone-chip{
  display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;
  letter-spacing:.02em;vertical-align:1px;
}
.tone-best{background:rgba(249,35,108,.24);color:#FFC2D6}
.tone-bright{background:rgba(249,35,108,.14);color:#FF9BBB}
.tone-soft{background:rgba(255,201,219,.13);color:var(--blush)}
.tone-caution{background:rgba(217,169,75,.18);color:var(--gilt)}

.toast{
  position:absolute;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:rgba(9,4,7,.94);border:1px solid rgba(217,169,75,.4);color:var(--cream);
  padding:11px 18px;border-radius:999px;font-size:12.5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .28s ease, transform .28s ease;z-index:20;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}


/* ============================================================
   MOBILE — 베젤을 벗고 화면이 뷰포트가 된다.
   기기 규칙(.phone/.screen/.statusbar …) 다음에 와야 이긴다.
   ============================================================ */
@media (max-width:480px){
  body{background:var(--ink);background-image:none}
  #app{display:block;padding:0;min-height:0}
  .stage{height:100dvh}
  .phone-scale{width:100%;transform:none !important}
  .phone{
    width:100%;height:100dvh;border-radius:0;padding:0;
    background:var(--ink);box-shadow:none;
  }
  .phone::after{display:none}
  .notch{display:none}
  .screen{width:100%;height:100dvh;border-radius:0}
  /* 상태바 오른쪽 자리는 언어 알약이 쓴다 — 신호·배터리 목업은 물러난다. */
  .statusbar{
    height:calc(46px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
    padding-right:92px;
  }
  .sb-right{display:none}
  .v{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(34px + env(safe-area-inset-bottom))}
  .langpill{
    top:calc(env(safe-area-inset-top) + 8px);
    right:calc(env(safe-area-inset-right) + 14px);
  }
}

@media (prefers-reduced-motion: reduce){
  .float,.cardback,.cf-sepo{animation:none !important}
  .flipper{transition:none !important}
  .bz-cell,.bz-fly,.cf-motif{transition:none !important}
  .v{animation:none !important}
  .caret{animation:none;display:none}
  /* 공개 페이싱도 전 단계 즉시 — 스크립트가 연출 클래스를 아예 걸지 않지만,
     남는 경로가 없도록 CSS 쪽에서도 한 번 더 닫는다. */
  .sq-rise,.sq-in,.quint .cardface.sq-pop,.bz-slots.is-seal .bz-slot-in,
  .v-browse.is-fade,.rv-teller.is-peer .teller,.rv-teller.is-peer .rv-think{animation:none !important}
  .sq-off{opacity:1 !important;pointer-events:auto !important}
  .quint-reader.is-weaving{animation:none !important}
  .rv-think{transition:none}
  *{scroll-behavior:auto}
}
</style>

<div id="app" data-lang="ko">

  <div class="langpill" role="group" aria-label="언어 전환">
    <button type="button" class="seg-btn is-on" data-lang-btn="ko" aria-pressed="true">KO</button>
    <button type="button" class="seg-btn" data-lang-btn="ja" aria-pressed="false">JA</button>
  </div>

  <div class="stage" id="stage">
    <div class="phone-scale" id="phoneScale">
      <div class="phone ja-swap" id="phone" lang="ko">
        <div class="notch"></div>
        <div class="screen">
          <div class="statusbar">
            <span class="sb-time" id="sbTime">21:04</span>
            <span class="sb-right">
              <span class="sb-bar" style="height:6px"></span>
              <span class="sb-bar" style="height:8px"></span>
              <span class="sb-bar" style="height:10px"></span>
              <span class="sb-batt"></span>
            </span>
          </div>
          <div class="appbar">
            <span class="appbar-t" id="appTitle">세포 타로</span>
            <span class="appbar-d" id="appDate">2026-09-01</span>
          </div>
          <div class="views" id="views" aria-live="polite" aria-atomic="false"></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";

/* =======================================================

e":"心のなかの本","up":{"tone":"soft","text":"答えはもう自分のなかにある日。人の助言より自分の直感のほうが正確。今日はぴんと来たほうを信じて。","action":"助言を求めず直感でひとつ","story":"直感が当たる日","verdict":"答えはもうきみの本に書いてある。今日は他人の目次を閉じる日。"},"rev":{"tone":"bright","text":"閉じていた頁がひらく日。相手の本音が思ったより見えます。見過ごしたサインを読み直してみて。","action":"前の会話を読み返す","story":"本音が見える日"}}},{"num":"XV","motif":"flower","archetype":"The Empress","ko":{"name":"따뜻한 정원","up":{"tone":"best","text":"가꾼 만큼 피어나는 날이에요. 오늘의 나는 그냥 있어도 좋아 보여요. 잘 보이려 애쓰지 않아도 돼요.","action":"오늘은 프로필 그대로 두기","story":"그냥 있어도 좋아 보이는 날","verdict":"오늘의 결론은 '이대로 좋다'야. 꽃은 애쓰는 손보다 볕을 더 좋아해."},"rev":{"tone":"soft","text":"정원에 물을 줄 차례예요. 남을 돌보느라 내 매력이 시들었어요. 오늘은 나에게 시간을 쓰세요.","action":"나를 위한 것 하나 하기","story":"나에게 물 주는 날"}},"ja":{"name":"あたたかい庭","up":{"tone":"best","text":"手をかけたぶんだけ咲く日。今日のあなたはそのままでよく見えます。よく見せようとしなくて大丈夫。","action":"今日はプロフィールをそのままにする","story":"そのままでよく見える日","verdict":"今日の結論は「このままでいい」。花は頑張る手より、日ざしのほうが好きだから。"},"rev":{"tone":"soft","text":"庭に水をやる番です。人にかまけて自分の魅力がしおれ気味。今日は自分に時間を使って。","action":"自分のためにひとつだけ","story":"じぶんに水をやる日"}}},{"num":"XVI","motif":"chariot","archetype":"The Chariot","ko":{"name":"직진의 전차","up":{"tone":"bright","text":"망설임이 제일 손해인 날이에요. 방향이 맞으면 속도는 저절로 붙어요. 생각을 반으로 줄이고 움직이세요.","action":"고민하던 좋아요 지금 보내기","story":"직진이 답인 날","verdict":"핸들은 이미 맞는 방향이야. 오늘은 액셀만 밟으면 돼."},"rev":{"tone":"caution","text":"속도가 마음을 앞지르는 날이에요. 급하게 달리면 중요한 걸 흘려요. 오늘은 브레이크가 실력이에요.","action":"보내기 전에 한 번만 다시 읽기","story":"브레이크가 실력인 날"}},"ja":{"name":"まっすぐな戦車","up":{"tone":"bright","text":"ためらいがいちばん損な日。方向が合っていれば速さは勝手についてくる。考える量を半分にして動いて。","action":"迷っていた「いいね」を今送る","story":"まっすぐが正解の日","verdict":"ハンドルはもう正しい向き。今日はアクセルを踏むだけでいい。"},"rev":{"tone":"caution","text":"速さが気持ちを追い越す日。急いで走ると大事なものを落とします。今日はブレーキが実力。","action":"送る前に一度だけ読み直す","story":"ブレーキが実力の日"}}},{"num":"XVII","motif":"ribbon_heart","archetype":"Strength","ko":{"name":"부드러운 힘","up":{"tone":"bright","text":"세게 잡는 것보다 부드럽게 여는 날이에요. 조급함 없이 기다릴 줄 아는 게 오늘의 힘이에요. 그 여유가 매력이 돼요.","action":"재촉 대신 다정한 안부 하나","story":"여유가 매력이 되는 날","verdict":"세게 쥔 손에는 아무것도 앉지 않아. 오늘은 편 손바닥이 p":{"tone":"bright","text":"온도가 맞아떨어지는 날이에요. 내 페이스와 상대 페이스가 자연스럽게 섞여요. 무리하지 않는 대화가 제일 멀리 가요.","action":"상대 답장 속도에 내 속도 맞추기","story":"온도가 맞는 날","verdict":"온도는 맞추는 거지 이기는 게 아니야. 오늘은 섞이는 쪽이 남아."},"rev":{"tone":"caution","text":"물이 따로 도는 날이에요. 나만 뜨겁거나 나만 차가울 수 있어요. 오늘은 온도차를 인정하는 게 먼저예요.","action":"속도 차이 그러려니 하기","story":"온도차를 인정하는 날"}},"ja":{"name":"まざりあう水","up":{"tone":"bright","text":"温度がかみ合う日。自分のペースと相手のペースが自然にまざります。無理のない会話がいちばん遠くまで行く。","action":"相手の返信ペースに合わせてみる","story":"温度が合う日","verdict":"温度は合わせるもので、勝つものじゃない。今日はまざるほうが残るよ。"},"rev":{"tone":"caution","text":"水が別々にまわる日。自分だけ熱いか、自分だけ冷たいかも。今日は温度差を認めるのが先。","action":"ペースの違いはそういうものと思う","story":"温度差を認める日"}}},{"num":"XXI","motif":"cocoon","archetype":"Death","ko":{"name":"허물벗기","up":{"tone":"soft","text":"허물을 벗는 날이에요. 끝나는 게 아니라 몸이 커진 거예요. 낡은 습관 하나를 오늘 벗어두세요.","action":"안 되던 방식 하나 그만두기","story":"허물 벗는 날","verdict":"좁아진 옷이 알려주는 건 하나야 — 네가 자랐다는 것. 오늘 하나 벗어두자."},"rev":{"tone":"caution","text":"벗을 때가 지났는데 붙잡고 있어요. 익숙함이 지금은 좁은 옷이에요. 조금 아쉬워도 벗어야 자라요.","action":"미련 하나 오늘 접기","story":"좁아진 옷을 벗는 날"}},"ja":{"name":"脱皮の日","up":{"tone":"soft","text":"脱皮の日。終わりじゃなくて、体が大きくなっただけ。古いくせをひとつ今日脱いでおこう。","action":"うまくいかないやり方をひとつやめる","story":"だっぴの日","verdict":"窮屈になった服が教えてくれるのはひとつ — きみが育ったってこと。今日ひとつ脱いでおこう。"},"rev":{"tone":"caution","text":"脱ぐ時期を過ぎたのに抱えています。慣れは今、窮屈な服。少し惜しくても脱がないと育たない。","action":"未練をひとつ今日たたむ","story":"窮屈な服を脱ぐ日"}}},{"num":"XXII","motif":"bell","archetype":"Judgement","ko":{"name":"다시 울리는 종","up":{"tone":"best","text":"다시 울리는 종소리가 있는 날이에요. 지나간 인연이 끝난 게 아니었을 수 있어요. 두 번째 기회는 오늘 같은 날 와요.","action":"아쉬웠던 인연에 다시 인사","story":"두 번째 기회가 오는 날","verdict":"끝난 줄 알았던 소리가 다시 울리는 날이야. 이번엔 귀를 막지 마."},"rev":{"tone":"soft","text":"종을 억지로 울리지 않아도 돼요. 지나간 건 지나간 대로 두는 게 맞는 날이에요. 새 종소리에 귀를 두세요.","action":"과거 말고 새 추천에 눈 두기","story":"새 종소리를 기다리는 날"}},"ja":{"name":"もういちど鳴る鐘","up":{"tone":"best","text":"もういちど鐘が鳴る日。過ぎたご縁は終わりじゃなかったのかも。二度目のチャンスはこういう日に来ます。","action":"気になっていた人にもういちど挨拶","story":"二度目のチャンスの日","verdict":"終わったと思った音がもう一度鳴る日。今度は耳をふさがないで。"},"rev":{"tone":"soft","text":"鐘を無理に鳴らさなくていい日。過ぎたものは過ぎたままにするのが正解。新しい鐘の音に耳を向けて。","action":"過去より新しいおすすめを見る","story":"新しい鐘を待つ日"}}}],"quint":{"formula":"((n1+n2+n3-1) % 22) + 1","reversedRule":"3장 중 2장 이상 역방향이면 역방향","intro":{"ko":"마음·만남·한 수 — 세 장의 숫자가 모여 오늘의 카드가 됐어.","ja":"こころ・出会い・ひと手 — 三枚の数字が今日の一枚になったよ。"},"intro_note":"intro 문장은 v6.2부터 UI 미표시(데이터만 보존)","verdict_note":"종합 섹션 본문 = up.verdict (자리 본문 up.text 재사용 금지 — 축인 날 이중 노출 방지, 반말 결론체)"},"synthesis":{"rule":"score = sum(tone in {best,bright}:+1, soft:0, caution:-1 for 3 drawn cards)","label":{"ko":"오늘의 날씨","ja":"今日の空模様"},"buckets":[{"min":3,"max":3,"ko":"오늘은 문이 다 열려 있는 날","ja":"今日は扉がぜんぶ開いている日"},{"min":1,"max":2,"ko":"밀어도 되는 날, 가볍게","ja":"押していい日、かるく"},{"min":0,"max":0,"ko":"온도를 맞춰가는 날","ja":"温度を合わせていく日"},{"min":-2,"max":-1,"ko":"서두르지 않아도 되는 날","ja":"急がなくていい日"},{"min":-3,"max":-3,"ko":"오늘은 나부터 챙기는 날","ja":"今日はじぶんを先に労わる日"}],"reader_frames":[{"min":3,"max":3,"variants":[{"ko":"세 장이 전부 같은 쪽을 보고 있어 — 이런 판은 자주 오지 않아. 오늘의 흐름은 전부 {q} 쪽으로 모여.","ja":"三枚がぜんぶ同じほうを向いてる — こんな並びはめったに来ない。今日の流れはぜんぶ{q}のほうへ集まってるよ。"},{"ko":"오늘은 바람이 전부 순풍이야. 돛만 펴면 돼 — 방향은 {q} 쪽.","ja":"今日は風がぜんぶ追い風だよ。帆を張るだけでいい — 向かう先は{q}のほう。"},{"ko":"불씨 세 개가 한 자리에 모였어. 오늘 하루의 이름은 {q} — 그렇게 불러도 되겠다.","ja":"火種が三つ、ひとつの場所に集まった。今日一日の名前は{q}にしていいくらい。"}]},{"min":1,"max":2,"variants":[{"ko":"오늘은 가볍게 움직여도 좋은 판이야. 흐름은 {q} 쪽으로 기울어 있어.","ja":"今日はかるく動いていい並びだよ。流れは{q}のほうへ傾いてる。"},{"ko":"물길이 순하게 나 있어. 억지로 젓지 않아도 {q} 쪽으로 흘러갈 거야.","ja":"水路がおだやかに通ってる。無理に漕がなくても{q}のほうへ流れていくよ。"},{"ko":"반 발짝이면 충분한 날이야. 그 반 발짝의 방향은 {q} 카드가 알려주고 있어.","ja":"半歩でじゅうぶんな日。その半歩の向きは{q}が教えてくれてる。"}]},{"min":0,"max":0,"variants":[{"ko":"서로 다른 온도가 한 상에 올라왔어. 가운데에서 균형을 잡는 카드는 {q}.","ja":"ちがう温度がひとつの卓に上がってきた。真ん中で釣り合いを取るのは{q}。"},{"ko":"밀물과 썰물이 같이 있는 날이야. 물때를 읽는 법은 {q} 카드에 적혀 있어.","ja":"満ち潮と引き潮が同居する日。潮の読みかたは{q}のカードに書いてある。"},{"ko":"저울이 딱 수평이야. 어느 쪽에 마음을 얹을지는 {q}한테 물어봐.","ja":"天秤がちょうど水平。どちらに心を載せるかは{q}に聞いてみて。"}]},{"min":-2,"max":-1,"variants":[{"ko":"오늘은 밀어붙이는 판이 아니야. 힘을 빼고, {q} 카드에 맡겨.","ja":"今日は押し切る並びじゃない。力を抜いて、{q}のカードに任せて。"},{"ko":"물이 흐려진 날엔 낚싯대를 거두는 거야. 오늘의 쉼표는 {q} 카드가 찍어줄 거야.","ja":"水が濁った日は竿をしまうもの。今日の読点は{q}が打ってくれる。"},{"ko":"바람이 맞바람이야. 걸음을 줄이고, 등은 {q} 쪽에 기대둬.","ja":"風が向かい風だよ。歩幅をせばめて、背中は{q}のほうに預けておいて。"}]},{"min":-3,"max":-3,"variants":[{"ko":"세 자리가 모두 쉬어 가라는 쪽이야. 오늘의 답은 밖이 아니라 안에 있어. {q} 카드가 그 마음을 지켜줄 거야.","ja":"三つの席がぜんぶ、ひと休みしようと言ってる。今日の答えは外じゃなくて内にある。{q}のカードがその気持ちを守ってくれる。"},{"ko":"오늘은 덮어두는 게 용기인 날이야. 이불 같은 {q} 카드를 곁에 둘게.","ja":"今日はそっと閉じておくのが勇気の日。毛布みたいなカード、{q}をそばに置いておくね。"},{"ko":"촛불을 아끼는 밤이야. 내일 켤 불씨는 {q} 카드가 맡아뒀어.","ja":"ろうそくを節約する夜だよ。明日ともす火種は{q}が預かっておく。"}]}],"action_rule":"행동 가이드는 하루 1개 — 자리 블록에서는 액션 미표시, 종합의 퀸트 카드 액션만 '오늘의 한 걸음'으로.","afterglow":{"rule":"index = (n1+n2+n3) % 6  (뽑힌 세 카드 번호 합 — 리딩마다 결정론적으로 하나)","lines":[{"ko":"우리는 아주 오래된 별의 조각이야. 오늘 마주치는 사람도 그래.","ja":"ぼくらはとても古い星のかけらだよ。今日すれちがう人もそう。"},{"ko":"좋은 인연은 소리 없이 와. 문만 조금 열어두면 돼.","ja":"いいご縁は音もなく来る。扉をすこし開けておくだけでいい。"},{"ko":"오늘의 너는 오늘만 있어. 그거면 충분한 이유야.","ja":"今日のきみは今日しかいない。それだけで十分な理由だよ。"},{"ko":"마음은 계절이랑 같아서, 겨울이어도 고장 난 게 아니야.","ja":"心は季節と同じで、冬だからって壊れてるわけじゃない。"},{"ko":"누굴 만나든, 너를 잃지 않는 쪽이 정답이야.","ja":"誰に会っても、自分を失わないほうが正解。"},{"ko":"운은 방향만 알려줘. 걸음은 늘 네 몫이라 다행이지.","ja":"運は方角しか教えてくれない。歩くのがきみの分でよかった。"}]},"reader_variant_rule":"variant = (n1*n2 + n3) % 3  (afterglow의 sum%6과 독립되도록 곱 혼합)"},"config":{"reversals":false,"note":"테스트 빌드는 정방향 온리(실존 타로 관행). 역방향 카피는 보존 — reversals=true로 복원."}};

/* =======================================================
   SEED — must match SPEC.md exactly
   ======================================================= */
function djb2(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h;}

/* djb2 는 승수 33 과 덱 크기 22 가 서로소가 아니라(gcd=11) 곱셈 구조가 나머지에 그대로
   남는다. 그대로 쓰면 (a) 하루 넘길 때 카드가 +11 로 92% 쏠리고 (b) 세 자리의 간격이
   사실상 한 값(+5)으로 고정된다. fmix32 로 비트를 섞어 그 구조를 끊는다. */
function mix32(h){
  h = h >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

/* 덱 크기는 여기 한 곳에서만 정한다 — 셔플 · 퀸트 · 캐러셀 · 트레이스가 전부 이 값을 본다. */
const DECK = 22;

/* 시드 키는 문자열 하나. 본편은 `유저ID|날짜`, 이 사내 테스트 빌드는 `뽑은 시각(JST, 초 단위)`.
   시드는 카드를 고르지 않는다 — 덱을 섞을 뿐이다. 같은 키면 언제 계산해도 같은 덱 순서. */
function prng(seedKey){
  let h = mix32(djb2(seedKey));
  return function(){ h = mix32(h + 0x9E3779B9); return h; };
}

/* Fisher–Yates. [0..21] 의 순열 하나를 돌려준다 — 이 배열이 이번 리딩의 덱이고,
   캐러셀 22칸이 그대로 이 배열의 22자리다. 위치 p 를 고르면 카드는 deck[p].
   순열이 균등하므로 중복 회피 보정이 필요 없다. */
function shuffledDeck(seedKey){
  const next = prng(seedKey);
  const a = [];
  for (let i = 0; i < DECK; i++) a.push(i);
  for (let i = DECK - 1; i > 0; i--){
    const j = next() % (i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 퀸테센스 — 세 장의 카드 번호(1..22) 합을 22로 환원해 오늘의 카드 한 장을 만든다.
   22장에서는 서로 다른 세 장의 전수 9,240가지가 22장에 정확히 420번씩 떨어진다(편차 0).
   이 빌드는 정방향 온리이므로 퀸트도 항상 정방향이다. */
function quintOf(draws){
  let sum = 0;
  for (const d of draws) sum += d.index + 1;
  const num = ((sum - 1) % DECK) + 1;
  return { index: num - 1, num: num, sum: sum, reversed: false };
}

/* =======================================================
   DATE (JST)
   ======================================================= */
function jstKey(ms){
  const d = new Date(ms + 9*3600*1000);
  return d.toISOString().slice(0,10);
}
/* 이 빌드의 시드 = 뽑은 시각(JST, 초 단위) "YYYY-MM-DDTHH:MM:SS".
   같은 리딩 안에서는 state.seedKey 로 고정되고, "다시 뽑기" 때만 새로 만든다. */
function nowSeedKey(){
  return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,19);
}
const WD = { ko:["일","월","화","수","목","금","토"], ja:["日","月","火","水","木","金","土"] };
function prettyDate(key, lang){
  const d = new Date(Date.parse(key + "T00:00:00Z"));
  const y = d.getUTCFullYear(), m = d.getUTCMonth()+1, day = d.getUTCDate();
  const w = WD[lang][d.getUTCDay()];
  return lang === "ja" ? (y+"年"+m+"月"+day+"日("+w+")") : (y+"년 "+m+"월 "+day+"일 ("+w+")");
}
function jstClock(){
  const d = new Date(Date.now() + 9*3600*1000);
  const hh = String(d.getUTCHours()).padStart(2,"0");
  const mm = String(d.getUTCMinutes()).padStart(2,"0");
  return hh + ":" + mm;
}

/* =======================================================
   DAILY LOCK (localStorage)
   키: sepo_tarot_v3:{userId} -> {"dateKey":"YYYY-MM-DD","done":true}
   ⚠️ 이 사내 테스트 빌드에서는 아래 세 함수를 흐름에서 호출하지 않는다(락 해제).
   본편 배선 그대로 남겨 두기 위해 정의만 유지한다. 샌드박스에서는 localStorage
   접근 자체가 throw 할 수 있으므로 읽기·쓰기·삭제를 전부 try/catch 로 감싼다.
   ======================================================= */
const LOCK_PREFIX = "sepo_tarot_v3:";
function lockRead(userId){
  try {
    const raw = window.localStorage.getItem(LOCK_PREFIX + userId);
    if (!raw) return null;
    const o = JSON.parse(raw);
    return (o && typeof o === "object") ? o : null;
  } catch (e){ return null; }
}
function lockWrite(userId, dateKey){
  try {
    window.localStorage.setItem(LOCK_PREFIX + userId, JSON.stringify({ dateKey: dateKey, done: true }));
  } catch (e){ /* 저장 불가 — 락 없이 계속 */ }
}
function lockClear(userId){
  try { window.localStorage.removeItem(LOCK_PREFIX + userId); } catch (e){ /* 삭제 불가 — 무시 */ }
}

/* =======================================================
   SYNTHESIS — 오늘의 날씨
   뽑힌 세 장의 톤을 더한다. best / bright = +1, soft = 0, caution = -1 → -3 .. +3.
   그 합이 떨어지는 구간의 헤드라인을 DATA.synthesis 에서 그대로 읽어 쓴다(생성 없음).
   ======================================================= */
const TONE_SCORE = { best:1, bright:1, soft:0, caution:-1 };
function bucketOf(list, score){
  for (let k = 0; k < list.length; k++){
    if (score >= list[k].min && score <= list[k].max) return list[k];
  }
  return list[list.length - 1];
}
function weather(draws){
  let score = 0;
  for (let i = 0; i < draws.length; i++){
    const tone = cardCopy(DATA.cards[draws[i].index], draws[i].reversed).body.tone;
    score += (tone in TONE_SCORE) ? TONE_SCORE[tone] : 0;
  }
  const S = DATA.synthesis;
  return { score: score, label: S.label[state.lang], text: bucketOf(S.buckets, score)[state.lang] };
}

/* 리더의 말 — 날씨와 같은 버킷에서 문장 틀을 하나 고르고 {q} 자리에 오늘의 카드
   이름만 끼워 넣는다. 세 장의 이름은 바로 위 블록이 이미 말했으므로 틀에서 뺐다.
   틀은 슬롯 뒤에 조사가 오지 않게 쓰여 있어 조사 보정 로직을 두지 않는다
   (그런 로직은 언젠가 반드시 틀린다).
   버킷 안에서 어느 틀을 쓸지는 (n1*n2 + n3) % 개수 로 정한다 — 세 장의 번호를
   곱으로 섞어서 여운 한 줄의 합(n1+n2+n3)과 같이 움직이지 않게 했다. */
function readerLine(draws, quint, score){
  const F = DATA.synthesis.reader_frames;
  if (!F || !draws || draws.length < 3) return "";
  const b = bucketOf(F, score);
  const vs = b.variants;
  if (!vs || !vs.length) return "";
  const n1 = draws[0].index + 1, n2 = draws[1].index + 1, n3 = draws[2].index + 1;
  const v = vs[(n1 * n2 + n3) % vs.length];
  return String(v[state.lang])
    .replace(/\{q\}/g, DATA.cards[quint.index][state.lang].name);
}

/* 여운 한 줄 — 뽑힌 세 장의 번호 합으로 6줄 중 하나를 고른다(리딩마다 고정).
   해석이 아니라 마무리 인사라서 카드 내용과 연결하지 않는다. */
function afterglowLine(draws){
  const A = DATA.synthesis.afterglow;
  if (!A || !A.lines || !draws || !draws.length) return "";
  let sum = 0;
  for (let i = 0; i < draws.length; i++) sum += draws[i].index + 1;
  return A.lines[sum % A.lines.length][state.lang];
}

function sceneArt(key, small){
  const raw = SCENE[key] || "";
  if (!small) return raw;
  return raw.replace(/stroke-width="([0-9.]+)"/g, function(m, v){
    return 'stroke-width="' + (Math.round(parseFloat(v) * 155) / 100) + '"';

/* 소진된 자리(이미 뽑은 위치)는 부채에서 빠진다 — 탐색도 건너뛰고 다시 고를 수도 없다.
   남은 자리만 모아 오름차순 링을 만들고, 배치·이동을 전부 이 링 위에서 계산한다. */
function liveRing(){
  const ring = [];
  for (let i = 0; i < DECK; i++){
    if (state.picked.indexOf(i) === -1) ring.push(i);
  }
  return ring;
}
function isGone(p){ return state.picked.indexOf(p) !== -1; }

/* 캐러셀 배치. 각 셀의 자리는 포커스로부터의 순환 거리 d 로만 정해진다.
   d 가 한 칸씩 바뀌면 transform 이 이어져 부채를 넘기는 느낌이 나고,
   링 끝에서 반대편으로 감기는 셀 한 장만 transition 을 잠깐 끊는다. */
let lastD = null;
function layoutCarousel(){
  const track = $("bzTrack");
  if (!track) return;
  const cells = track.children;
  const ring = liveRing();
  const L = ring.length;
  const halfL = L >> 1;
  const rank = {};
  for (let k = 0; k < L; k++) rank[ring[k]] = k;
  const rf = (state.focus in rank) ? rank[state.focus] : 0;
  if (!lastD) lastD = {};
  for (let i = 0; i < cells.length; i++){
    const c = cells[i];
    const gone = !(i in rank);
    c.classList.toggle("is-gone", gone);
    if (gone){
      c.style.transition = "";
      c.style.opacity = "0";
      c.style.zIndex = "0";
      c.classList.remove("is-focus");
      delete lastD[i];
      continue;
    }
    const d = ((rank[i] - rf + halfL + L) % L) - halfL;
    const ad = Math.abs(d);
    const sc = Math.max(0.5, 1 - ad * 0.12);
    const y = ad === 0 ? -8 : ad * 13;
    const op = ad === 0 ? 1 : (ad === 1 ? 0.82 : (ad === 2 ? 0.46 : (ad === 3 ? 0.15 : 0)));
    const tf = "translate(" + (d * 62) + "px," + y + "px) rotate(" + (d * 7) + "deg) scale(" + sc + ")";
    const prev = (i in lastD) ? lastD[i] : null;
    const jump = (prev === null) || Math.abs(d - prev) > 1;
    if (jump) c.style.transition = "none";
    c.style.transform = tf;
    c.style.opacity = String(op);
    c.style.zIndex = String(20 - ad);
    c.classList.toggle("is-focus", ad === 0);
    if (jump){ void c.offsetWidth; c.style.transition = ""; }
    lastD[i] = d;
  }
}
/* 남은 자리 링 위에서 step 칸 이동한 덱 자리를 돌려준다. */
function stepFocus(from, step){
  const ring = liveRing();
  if (!ring.length) return from;
  let at = ring.indexOf(from);
  if (at === -1){
    /* from 이 방금 소진됐다면 링에서 그 자리의 바로 다음을 출발점으로 삼는다. */
    at = 0;
    for (let k = 0; k < ring.length; k++){ if (ring[k] > from){ at = k; break; } }
    if (step > 0) step -= 1;
  }
  return ring[((at + step) % ring.length + ring.length) % ring.length];
}
function slideBy(dir){
  if (state.view !== "browse" || state.flying || sealing) return;
  state.focus = stepFocus(state.focus, dir);
  layoutCarousel();
}
function offsetIn(el, root){
  let x = 0, y = 0, n = el;
  while (n && n !== root){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x: x, y: y };
}
function flyToSlot(slotIdx, done){
  const wrap = $("browseWrap");
  const pick = $("bzPick");
  const slot = wrap ? wrap.querySelectorAll(".bz-slot-in")[slotIdx] : null;
  if (!wrap || !pick || !slot || REDUCED.matches){ done(); return; }
  const a = offsetIn(pick, wrap), b = offsetIn(slot, wrap);
  const pw = pick.offsetWidth, ph = pick.offsetHeight;
  const sw = slot.offsetWidth, sh = slot.offsetHeight;
  const fly = document.createElement("div");
  fly.className = "bz-fly";
  fly.style.left = a.x + "px";
  fly.style.top = a.y + "px";
  fly.style.width = pw + "px";
  fly.style.height = ph + "px";
  fly.innerHTML = '<div class="cardback">' + SIGIL + '</div>';
  wrap.appendChild(fly);
  const sc = sw / pw;
  const dx = b.x + (sw - pw)/2 - a.x;
  const dy = b.y + (sh - ph)/2 - a.y;
  state.flying = true;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      fly.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sc + ")";
      fly.style.opacity = "0.92";
    });
  });
  setTimeout(function(){
    if (fly.parentNode) fly.parentNode.removeChild(fly);
    state.flying = false;
    done();
  }, 440);
}
function pickCard(){
  if (state.view !== "browse" || state.flying || sealing) return;
  if (state.picked.length >= 3) return;
  if (isGone(state.focus)) return;   /* 이미 소진된 자리 — 다시 고를 수 없다 */
  const taken = state.focus;
  state.picked.push(taken);
  /* 고른 자리는 그 순간 부채에서 빠진다. 날아가는 카드가 복제로 보이지 않게
     먼저 그 칸만 감추고, 남은 칸의 재배치는 착지 후에 한다. */
  const track = $("bzTrack");
  const cell = track ? track.children[taken] : null;
  if (cell){ cell.style.opacity = "0"; cell.classList.remove("is-focus"); }
  flyToSlot(state.picked.length - 1, function(){
    if (state.picked.length >= 3){
      sealSeq();
    } else {
      state.focus = stepFocus(taken, 5);
      const wrap = $("browseWrap");
      if (wrap){
        const s = wrap.querySelector(".bz-slots");
        const h = wrap.querySelector(".bz-head");
        if (s) s.innerHTML = browseSlotsHTML();
        if (h) h.innerHTML = browseHeadHTML();
      }
      layoutCarousel();
    }
  });
}

/* =======================================================
   TYPING
   ======================================================= */
function stopTyping(){
  if (typeTimer){ clearInterval(typeTimer); typeTimer = null; }
}
function finishTyping(){
  stopTyping();
  const nodes = views.querySelectorAll(".typed");
  for (let i = 0; i < nodes.length; i++){
    nodes[i].textContent = nodes[i].getAttribute("data-full");
    nodes[i].classList.add("is-done");
  }
}
/* 넘겨받은 노드만 순서대로 친다. 리딩 화면은 리드 버블과 리더의 말을 서로 다른
   시점에 시작하므로 대상과 완료 콜백을 밖에서 정한다(엔진은 그대로다). */
function typeNodes(nodes, done){
  stopTyping();
  if (!nodes.length){ if (done) done(); return; }
  if (REDUCED.matches){ finishTyping(); if (done) done(); return; }
  nodes.forEach(function(n){ n.textContent = ""; });
  let ni = 0, ci = 0;
  typeTimer = setInterval(function(){
    if (ni >= nodes.length){ stopTyping(); return; }
    const node = nodes[ni];
    const full = node.getAttribute("data-full");
    ci++;
    node.textContent = full.slice(0, ci);
    if (ci >= full.length){
      node.classList.add("is-done");
      ni++; ci = 0;
      if (ni >= nodes.length){ stopTyping(); if (done) done(); }
    }
  }, 28);
}
function runTyping(){
  typeNodes(Array.prototype.slice.call(views.querySelectorAll(".typed")));
}
/* 이미 한 번 본 리딩을 다시 그릴 때(언어 전환) 쓰는 변형 — 나머지는 지금까지처럼
   한 번에 치고, 리더의 말 한 줄만 새 언어로 다시 쓴다. 라이브가 없으면 이 함수는
   호출되지 않는다(render 가 liveReady 로 가른다). */
function runTypingLive(){
  const all = Array.prototype.slice.call(views.querySelectorAll(".typed"));
  const rd = views.querySelector(".quint-reader.typed");
  const rest = all.filter(function(n){ return n !== rd; });
  typeNodes(rest, function(){ readerFill(rd, null); });
}

/* =======================================================
   SEQ — 공개 페이싱 타임라인 (v6.2)
   화면 연출의 타이머는 전부 여기서만 만든다. 뷰가 바뀌거나 다시 뽑으면
   한 번에 죽이고(seqCancel), 탭 스킵·백그라운드 전환에는 남은 단계를
   그 자리에서 순서대로 완주시킨다(seqFinish). 흩어진 setTimeout 이 없으므로
   빠르게 다시 뽑아도 지난 리딩의 전환이 뒤늦게 튀어나오지 않는다.
   ======================================================= */
let seqSteps = [];     /* [{id, fn, done}] — 등록 순서 = 완주 순서 */
let seqTimers = [];
let seqIvals = [];
let seqOn = false;
let seqRush = false;   /* 지금 "남은 단계 몰아치기" 중인가 — 연출을 생략하는 신호 */

function seqClear(){
  for (let i = 0; i < seqTimers.length; i++) clearTimeout(seqTimers[i]);
  for (let i = 0; i < seqIvals.length; i++) clearInterval(seqIvals[i]);
  seqTimers = [];
  seqIvals = [];
}
function seqCancel(){ seqClear(); seqSteps = []; seqOn = false; }
function seqStep(i){
  const s = seqSteps[i];
  if (!s || s.done) return;
  s.done = true;
  s.fn();
}
function seqStart(steps){
  seqCancel();
  seqOn = true;
  seqSteps = steps.map(function(s){ return { id: s.id || null, fn: s.fn, done: false }; });
  for (let i = 0; i < steps.length; i++){
    if (typeof steps[i].at === "number") seqTimeout(i, steps[i].at);
  }
}
function seqTimeout(i, ms){
  seqTimers.push(setTimeout(function(){ seqStep(i); }, ms));
}
/* 시퀀스 도중에 다음 단계를 잇는다. 이미 끝난 뒤라면 기다릴 이유가 없으니 즉시. */
function seqAfter(ms, fn){
  if (!seqOn){ fn(); return; }
  seqSteps.push({ id: null, fn: fn, done: false });
  seqTimeout(seqSteps.length - 1, ms);
}
/* 시간이 아니라 사건(타이핑 완료 등)으로 열리는 단계. */
function seqFire(id){
  for (let i = 0; i < seqSteps.length; i++){
    if (seqSteps[i].id === id){ seqStep(i); return; }
  }
}
function seqEvery(ms, fn){ seqIvals.push(setInterval(fn, ms)); }
/* 남은 단계를 등록 순서대로 즉시 실행한다 — 스킵·언어 전환·백그라운드의 공통 출구.
   실행 중 render() 가 seqCancel 을 부르더라도 지역 사본으로 끝까지 돈다. */
function seqFinish(){
  if (!seqOn) return;
  seqClear();
  seqOn = false;
  seqRush = true;
  const list = seqSteps;
  for (let i = 0; i < list.length; i++){
    if (!list[i].done){ list[i].done = true; list[i].fn(); }
  }
  seqRush = false;
  if (seqSteps === list) seqSteps = [];
}
/* 탭 한 번 = 지금 화면에 남은 것 전부 끝. 타이핑도 같이 완성한다.
   라이브 생성 중이었다면 먼저 문장을 확정한다 — 그래야 뒤따르는 finishTyping 이
   지금 화면에 맞는 문장을 쓴다. */
function seqSkip(){
  liveSkip();
  finishTyping();
  seqFinish();
}

/* 연출 클래스 헬퍼 — "최종 상태가 기본"이라 감추는 쪽이 명시적이다. */
function sqHide(el){ if (el) el.classList.add("sq-off"); }
function sqStrip(e){
  const el = e.currentTarget;
  if (e.target !== el) return;   /* 자식(둥실거리는 세포 등)의 애니메이션에 반응하지 않는다 */
  el.classList.remove("sq-in", "sq-rise", "sq-pop");
  el.removeEventListener("animationend", sqStrip);
}
function sqArm(el, cls){
  if (!el || REDUCED.matches) return;
  el.classList.add(cls);
  el.addEventListener("animationend", sqStrip);
}
function sqShow(el, cls){
  if (!el) return;
  el.classList.remove("sq-off");
  if (!cls || seqRush) return;
  sqArm(el, cls);
}
function sqUnarm(list){
  for (let i = 0; i < list.length; i++) list[i].classList.remove("sq-rise");
}

/* 한 리딩 안에서 이미 한 번 연출한 화면은 다시 연출하지 않는다 —
   언어를 바꿔 다시 그릴 때 카드가 또 뒤집히면 그건 연출이 아니라 사고다. */
const ARMED = { reveal:false, reading:false };
let sealing = false;

/* -------------------------------------------------------
   ① 선택 완료 → 리빌 전환
   세 번째 카드가 자리에 앉으면 자리 칩 셋이 한 번 빛나고(홀드 500ms),
   브라우즈 화면이 280ms 페이드아웃한 뒤에 리빌로 넘어간다.
   ------------------------------------------------------- */
function sealSeq(){
  const wrap = $("browseWrap");
  const toReveal = function(){
    sealing = false;
    ARMED.reveal = false;
    buildDraws();
    state.view = "reveal";
    render();
  };
  if (!wrap || REDUCED.matches){ toReveal(); return; }
  const slots = wrap.querySelector(".bz-slots");
  if (slots){
    slots.innerHTML = browseSlotsHTML();   /* 세 번째 자리까지 채운 모습으로 */
    slots.classList.add("is-seal");
  }
  wrap.classList.add("is-seal");
  sealing = true;
  seqStart([
    { at: 500, fn: function(){ wrap.classList.add("is-fade"); } },
    { at: 780, fn: toReveal }
  ]);
}

/* -------------------------------------------------------
   ② 리빌 — 뒷면이 깔리고, 타로포가 들여다보고, 한 장씩 뒤집힌다.
   0    세 장이 뒷면으로 rise-in (300ms, 150ms 간격)
   450  타로포 등장 — 좌우로 갸웃거리며 카드를 살핀다(눈 깜빡임 650ms 박자)
   1650 타로포가 가라앉는다(흔들림·생각 방울 정지)
   1800/2450/3100  순차 플립(각 600ms, 650ms 간격)
   3950 "리딩 보기" 페이드인
   화면 어디를 탭하든 남은 단계가 그 자리에서 전부 끝난다.
   ------------------------------------------------------- */
function revealSeq(){
  const v = views.querySelector(".v-reveal");
  if (!v) return;
  const cols = v.querySelectorAll(".rv-col");
  const flips = v.querySelectorAll(".flipper");
  const teller = $("rvTeller");
  const face = $("rvSepo");
  const btn = v.querySelector("[data-go]");
  const settle = function(){
    if (teller) teller.classList.remove("is-peer");
    if (face) face.src = SEPO.sepo_baby_idle;
  };
  const flipAt = function(i){
    return function(){
      if (seqRush) v.classList.add("is-skip");   /* 스킵이면 전환 없이 앞면 */
      if (flips[i]) flips[i].classList.add("is-flipped");
    };
  };
  for (let i = 0; i < cols.length; i++) sqArm(cols[i], "sq-rise");
  sqHide(teller);
  sqHide(btn);
  const steps = [
    { at: 450, fn: function(){
        sqShow(teller, "sq-in");
        if (teller && !seqRush) teller.classList.add("is-peer");
        if (face && !seqRush){
          seqEvery(650, function(){
            face.src = SEPO.sepo_baby_blink;
            seqTimers.push(setTimeout(function(){ face.src = SEPO.sepo_baby_idle; }, 170));
          });
        }
      } },
    { at: 600, fn: function(){ sqUnarm(cols); } },
    { at: 1650, fn: settle }
  ];
  for (let i = 0; i < flips.length; i++) steps.push({ at: 1800 + i * 650, fn: flipAt(i) });
  steps.push({ at: 1800 + (flips.length - 1) * 650 + 850, fn: function(){ sqShow(btn, "sq-in"); } });
  seqStart(steps);
}

/* =======================================================
   READER LINE — 라이브 생성 (sample)
   리더의 말 한 줄만 뷰어의 Claude 가 그 자리에서 쓴다. 기능이 없거나(로컬 프리뷰·
   미지원 환경) 늦거나 실패하면 사람이 쓴 문장 틀로 되돌아간다 — 화면에 문장이
   없는 순간은 없고, 없는 환경에서는 이 파일이 v6.3 그대로 돈다.
   페이지의 나머지 어느 곳도 이 경로를 알지 못한다.
   ======================================================= */
const LIVE_WAIT = 9000;        /* 첫 글자를 기다리는 시간. 넘으면 끊고 문장 틀로 간다 */
const LIVE_WAIT_FIRST = 30000; /* 페이지 첫 호출은 동의 창 시간이 포함되므로 길게 기다린다 */
let liveEverStreamed = false;  /* 델타를 한 번이라도 받으면 이후 호출은 짧은 대기로 */
const LIVE_MIN = 12;      /* 스킵할 때 "한 문장 왔다"고 인정하는 최소 길이 */
/* 출력에 이런 말이 섞이면 통째로 버린다 — 확률·점수 화법은 이 서비스가 하지 않는 말이다. */
const LIVE_BAN = /%|점수|확률|성공률|궁합\s*지수|点数|確率|成功率/;

let liveState = "idle";   /* idle → pending → on | off. off 면 아래 경로는 아예 열리지 않는다 */
let liveUse = null;       /* sample 기능을 묻는 약속 — 한 번만 만든다 */
let liveCtl = null;       /* 진행 중 호출의 AbortController — 호출마다 새로 만든다 */
let liveWatch = null;     /* 첫 글자 감시 타이머 */
let liveGen = 0;          /* 호출 세대 — 늦게 도착한 콜백을 버리는 표 */
let liveSkipHook = null;  /* 스트림 중 탭이 부를 마무리(없으면 스트림 중이 아니다) */

/* 기능이 있는지 한 번만 묻는다. use() 가 이 페이지의 유일한 claude 접근이고,
   답은 나중에 온다(그리고 null 일 수 있다) — 그래서 타임라인은 이 약속을 기다리지 않는다. */
function liveInit(){
  if (liveState !== "idle") return;
  if (typeof claude === "undefined" || !claude || typeof claude.use !== "function"){
    liveState = "off";
    return;
  }
  liveState = "pending";
  liveUse = claude.use("sample").then(function(fn){
    liveState = (typeof fn === "function") ? "on" : "off";
    return liveState === "on" ? fn : null;
  }, function(){
    liveState = "off";
    return null;
  });
}
function liveStop(){
  if (liveWatch){ clearTimeout(liveWatch); liveWatch = null; }
  if (liveCtl){ liveCtl.abort(); liveCtl = null; }
}
/* 다시 뽑기·뷰 전환·언어 토글의 공통 출구 — render() 가 매번 부른다.
   세대를 올려 두면 늦게 도착한 콜백이 지난 화면에 글씨를 쓰지 못한다. */
function liveAbort(){
  liveGen++;
  liveSkipHook = null;
  liveStop();
}
/* 스트림 중 탭 — seqSkip 의 첫 줄. 스트림이 아니면 아무 일도 없다. */
function liveSkip(){
  const f = liveSkipHook;
  if (f) f();
}
/* 지금 이 언어의 리더의 말을 라이브로 쓸 자리가 있는가.
   기능이 없으면(off·idle) 언제나 false — 그 경우 페이지는 지금까지처럼 돈다. */
function liveReady(){
  return !REDUCED.matches &&
         (liveState === "on" || liveState === "pending") &&
         !state.readerLive[state.lang];
}

/* 마지막 완결 문장까지만 남긴다. 완결 문장이 없으면 빈 문자열 — 부르는 쪽이 문장 틀로 간다. */
function liveCut(s, min){
  const m = String(s).match(/^[\s\S]*[.。!！?？…]/);
  if (!m) return "";
  const cut = m[0].trim();
  return cut.length >= (min || 1) ? cut : "";
}
/* 화면에 올려도 되는 문장인지 정한다. 아니면 빈 문자열(=문장 틀로 폴백). */
function liveClean(raw){
  let s = String(raw == null ? "" : raw).replace(/\s+/g, " ").trim();
  if (!s || LIVE_BAN.test(s)) return "";
  if (s.length > 300) s = liveCut(s.slice(0, 300), 1);
  return s;
}

/* 프롬프트 — 오늘 뽑힌 리딩 한 벌을 그대로 재료로 넘긴다.
   두 언어를 따로 쓴다. 번역이 아니라 화법이 다르기 때문이다. */
function livePrompt(){
  const q = state.quint;
  const qCard = DATA.cards[q.index];
  const qCopy = cardCopy(qCard, q.reversed);
  const g = state.draws.map(function(d){
    const c = cardCopy(DATA.cards[d.index], d.reversed);
    return c.name + " — " + (c.body.story || c.body.text);
  });
  const qn = qCard[state.lang].name;
  const qv = qCopy.body.verdict || qCopy.body.text;
  const wx = weather(state.draws).text;
  if (state.lang === "ja"){
    return [
      "きみは「タロポ」だよ。デーティングアプリのマスコットで、カードを読んでくれるやさしい友だち。タメ口（「〜だよ」「〜してごらん」）で話してね。",
      "かくれたルール: カードを読む目で見るけど、「タロット」「占い」「リーダー」みたいな肩書きの言葉は文に出さないで。",
      "",
      "今日のリーディング:",
      "- こころの場所: " + g[0],
      "- 出会いの場所: " + g[1],
      "- ひと手の場所: " + g[2],
      "- 今日の一枚（まとめ）: " + qn + " — " + qv,
      "- 今日の空もよう: " + wx,
      "",
      "しごと: 三つの場所をひとつの流れにつなぐまとめのコメントを、ちょうど1〜2文で書いて。",
      "ルール:",
      "- " + qn + " のカード名は必ず文に入れて。ほかの三枚のカード名は並べないで（上でもう見せたから）。",
      "- 確率・点数・相性の数値・成功の予測・保証する言い方は禁止。健康とお金の話も禁止。",
      "- 大きなもの（星・季節・水・光・風）と今日の小さなひと歩きをつなぐたとえは1つまで。",
      "- 文だけ出力して。かぎかっこ・絵文字・前置き・説明は禁止。"
    ].join("\n");
  }
  return [
    "너는 '타로포'야. 데이팅 앱의 마스코트로, 카드를 읽어주는 다정한 친구야. 반말(\"~야\", \"~해줄게\")로 말해.",
    "숨긴 규칙: 카드 리더의 눈으로 읽되 '타로'·'점술'·'리더' 같은 직함 단어는 문장에 쓰지 마.",
    "",
    "오늘의 리딩:",
    "- 마음 자리: " + g[0],
    "- 만남 자리: " + g[1],
    "- 한 수 자리: " + g[2],
    "- 오늘의 카드(종합): " + qn + " — " + qv,
    "- 오늘의 날씨: " + wx,
    "",
    "임무: 세 자리를 하나의 흐름으로 잇는 종합 코멘트를 딱 1~2문장으로 써.",
    "규칙:",
    "- " + qn + " 카드명을 반드시 문장에 넣어. 나머지 세 카드명은 나열하지 마(위에서 이미 보여줬어).",
    "- 확률·점수·궁합 수치·성공 예측·보장 표현 금지. 건강·금전 얘기 금지.",
    "- 큰 것(별·계절·물·빛·바람)과 오늘의 작은 걸음을 잇는 은유는 1개까지만.",
    "- 문장만 출력해. 따옴표·이모지·머리말·설명 금지."
  ].join("\n");
}

/* 리더의 말 한 줄을 채운다 — 이 화면에서 리더의 말이 채워지는 유일한 문이다.
   done 은 문장이 확정된 뒤 딱 한 번 불린다(라이브든 폴백이든).
   라이브가 아니면 v6.3 과 같은 한 줄, typeNodes 그대로다. */
function readerFill(node, done){
  const fin = function(){ if (done) done(); };
  if (!node){ fin(); return; }
  if (!liveReady()){ typeNodes([node], fin); return; }

  const tmpl = node.getAttribute("data-tmpl") || node.getAttribute("data-full") || "";
  const gen = ++liveGen;
  const ctl = new AbortController();   /* 호출마다 새로 — 한 번 끊긴 신호는 되살아나지 않는다 */
  let open = true;
  let streamed = "";
  const stale = function(){ return !open || gen !== liveGen; };
  const close = function(){ open = false; liveSkipHook = null; liveStop(); };

  /* 사람이 쓴 문장으로 되돌아간다 — 기존 타이핑 그대로다. */
  const toTmpl = function(){
    if (stale()) return;
    close();
    node.classList.remove("is-weaving");
    node.setAttribute("data-full", tmpl);
    if (seqRush){ finishTyping(); fin(); return; }
    typeNodes([node], fin);
  };
  /* 라이브 문장 확정 — 스트림이 이미 다 써 놓았으니 타이핑을 새로 걸지 않는다. */
  const toLive = function(line){
    if (stale()) return;
    close();
    state.readerLive[state.lang] = line;
    node.classList.remove("is-weaving");
    node.setAttribute("data-full", line);
    node.textContent = line;
    node.classList.add("is-done");
    fin();
  };
  /* 스트림 중 탭 — 온 만큼이 한 문장을 이루면 그걸로 닫고, 아니면 문장 틀로.
     문장만 확정하고 화면은 건드리지 않는다. 뒤이어 오는 finishTyping 이 써 준다. */
  liveSkipHook = function(){
    if (stale()) return;
    const kept = liveCut(liveClean(streamed), LIVE_MIN);
    close();
    node.classList.remove("is-weaving");
    if (kept) state.readerLive[state.lang] = kept;
    node.setAttribute("data-full", kept || tmpl);
  };

  liveCtl = ctl;
  node.classList.remove("is-done");
  node.classList.add("is-weaving");
  node.textContent = t().weaving;
  /* 첫 글자가 늦으면(동의 창·대기열·무응답) 기다림을 여기서 끝낸다. 재시도는 없다. */
  liveWatch = setTimeout(toTmpl, liveEverStreamed ? LIVE_WAIT : LIVE_WAIT_FIRST);

  liveUse.then(function(fn){
    if (stale()) return null;
    if (typeof fn !== "function"){ toTmpl(); return null; }
    /* 스트림이 곧 타이핑이다 — onText 의 text 는 지금까지의 전체 답이라 대입으로 갱신한다. */
    return fn(livePrompt(), {
      modelTier: "quick",
      signal: ctl.signal,
      onText: function(u){
        if (stale()) return;
        streamed = String((u && u.text) || "");
        liveEverStreamed = true;
        if (liveWatch){ clearTimeout(liveWatch); liveWatch = null; }
        node.classList.remove("is-weaving");
        node.textContent = streamed;
      }
    });
  }).then(function(r){
    if (stale() || !r) return;
    const line = liveClean(r.text);
    /* 길이 제한에 걸려 끊긴 답은 완결된 문장까지만 쓴다. */
    const safe = r.truncated ? liveCut(line, LIVE_MIN) : line;
    if (safe) toLive(safe); else toTmpl();
  }, function(){
    /* not_granted·rate_limited·upstream_error·cancelled — 갈 곳은 하나뿐이다. */
    if (stale()) return;
    toTmpl();
  });
}

/* -------------------------------------------------------
   ③ 리딩 — 한 번에 쏟지 않고 순서대로 연다.
   0     리드 버블 타이핑 시작 + 자리 블록 3개가 0/400/800ms 간격으로 rise-in
   1400  구분선 + 오늘의 날씨 칩
   이어서 리더의 말 타이핑(리드가 아직이면 끝나는 대로)
   리더의 말 완료  오늘의 카드가 스케일+금박 글로우로 서고, 본문·한 걸음·CTA 페이드인
   +360  여운 한 줄
   내용은 처음부터 DOM 에 있다 — 늦게 오는 것은 눈뿐이고 보조기술은 기다리지 않는다.
   ------------------------------------------------------- */
function readingSeq(){
  const wrap = $("readWrap");
  if (!wrap) return;
  /* "리딩 보기"를 누른 뒤에야 기능을 묻는다 — 뷰어가 비용을 내는 호출이라
     클릭 이전에는 이 줄이 실행되지 않는다. 답은 나중에 오고, 없어도 타임라인은 그대로다. */
  liveInit();
  const pick = function(s){ return wrap.querySelector(s); };
  const typed = wrap.querySelectorAll(".typed");
  const lead = typed[0] || null;
  const reader = typed[1] || null;
  const blocks = wrap.querySelectorAll(".rd-block");
  const div = pick(".rd-div");
  const wx = pick(".quint-weather");
  const card = pick(".quint .cardface");
  const late = [pick(".cf-badge-out"), pick(".quint-axis"), pick(".quint-text"),
                pick(".quint-step"), pick(".rd-actions")];
  const glow = pick(".rd-glow");

  [div, wx, reader, card, glow].forEach(sqHide);
  late.forEach(sqHide);
  for (let i = 0; i < blocks.length; i++) sqArm(blocks[i], "sq-rise");

  let leadDone = false, readerWanted = false;
  const startReader = function(){
    sqShow(reader);
    /* 몰아치기 중이라면 타이핑을 새로 걸지 않는다 — 이미 완성된 문장을 지울 뿐이다. */
    if (seqRush){ finishTyping(); return; }
    readerFill(reader, function(){ seqFire("quint"); });
  };
  seqStart([
    { at: 1100, fn: function(){ sqUnarm(blocks); } },
    { at: 1400, fn: function(){
        sqShow(div, "sq-in");
        sqShow(wx, "sq-in");
        readerWanted = true;
        if (leadDone) startReader();
      } },
    { id: "quint", fn: function(){
        sqShow(reader);
        sqShow(card, "sq-pop");
        late.forEach(function(el){ sqShow(el, "sq-in"); });
        seqAfter(360, function(){ sqShow(glow, "sq-in"); });
      } }
  ]);
  typeNodes(lead ? [lead] : [], function(){
    leadDone = true;
    if (readerWanted) startReader();
  });
}

/* =======================================================
   RENDER
   ======================================================= */
function render(){
  stopTyping();
  seqCancel();   /* 지난 화면의 연출은 여기서 끝난다 — 유령 타이머 금지 */
  liveAbort();   /* 진행 중이던 라이브 생성도 함께 — 다시 뽑기·뷰 전환·언어 토글의 공통 출구 */
  let html = "";
  if (state.view === "entry") html = viewEntry();
  else if (state.view === "browse") html = viewBrowse();
  else if (state.view === "reveal") html = viewReveal();
  else if (state.view === "story") html = viewStory();
  else html = viewReading();
  views.innerHTML = html;
  views.scrollTop = 0;

  if (state.view === "browse"){
    lastD = null;
    layoutCarousel();
    const stage = $("bzStage"), pick = $("bzPick");
    if (stage && pick){
      const on = function(){ stage.classList.add("is-lift"); };
      const off = function(){ stage.classList.remove("is-lift"); };
      pick.addEventListener("mouseenter", on);
      pick.addEventListener("mouseleave", off);
      pick.addEventListener("focus", on);
      pick.addEventListener("blur", off);
    }
  }
  /* 연출은 한 리딩에 한 번뿐이다. 이미 지나간 화면(언어 전환 등)은 최종 상태로 그린다. */
  if (state.view === "reveal"){
    if (REDUCED.matches || ARMED.reveal){
      const flippers = views.querySelectorAll(".flipper");
      for (let i = 0; i < flippers.length; i++) flippers[i].classList.add("is-flipped");
    } else {
      ARMED.reveal = true;
      revealSeq();
    }
  }
  if (state.view === "reading"){
    if (REDUCED.matches || ARMED.reading){
      /* 이미 한 번 연출한 화면이다. 다만 이 언어의 리더의 말이 아직 없고 라이브가
         가능하면 그 한 줄만 새로 쓴다 — 그 밖에는 지금까지처럼 전부 한 번에 친다. */
      if (liveReady()) runTypingLive();
      else runTyping();
    }
    else { ARMED.reading = true; readingSeq(); }
  }

  $("appTitle").textContent = t().appTitle;
  $("appDate").textContent = prettyDate(state.dateKey, state.lang);
}

function syncChrome(){
  $("phone").setAttribute("lang", state.lang);
  app.setAttribute("data-lang", state.lang);
}

/* =======================================================
   TOAST
   ======================================================= */
let toastTimer = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("is-on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("is-on"); }, 2600);
}

/* =======================================================
   ACTIONS
   ======================================================= */
/* 고른 자리 3개를 카드로 바꾼다. 자리 이름은 뽑은 순서대로 마음 → 만남 → 한 수.
   서로 다른 자리를 골랐으므로 세 장이 겹치는 일은 구조적으로 없다. */
function buildDraws(){
  const P = positions();
  state.draws = state.picked.map(function(slot, i){
    return { index: state.deck[slot], reversed: false, position: P[i], slot: slot };
  });
  state.quint = quintOf(state.draws);
}

/* 뽑기 시작 — 누른 시각이 이번 리딩의 시드가 되고, 그 시드가 덱을 한 번 섞는다.
   섞인 뒤로 순서는 고정이고, 어느 자리를 여는지는 유저가 정한다.
   "다시 뽑기"도 같은 경로로 새 시드를 만들어 덱을 다시 섞는다. */
function startDraw(){
  sealing = false;
  ARMED.reveal = false;
  ARMED.reading = false;
  state.seedKey = nowSeedKey();
  state.dateKey = state.seedKey.slice(0,10);
  state.deck = shuffledDeck(state.seedKey);
  state.picked = [];
  state.draws = [];
  state.quint = null;
  state.posted = false;
  state.readerLive = { ko:null, ja:null };   /* 새 리딩 = 새 문장 */
  state.focus = djb2(state.seedKey) % DECK;
  state.view = "browse";
  render();
}
function openStory(){
  state.storySel = "quint";
  state.capEdited = false;
  state.caption = defaultCaption();
  state.posted = false;
  state.view = "story";
  render();
}
function setStorySel(sel){
  state.storySel = sel;
  if (!state.capEdited) state.caption = defaultCaption();
  render();
  const el = views.querySelector('.st-chip[data-sel="' + sel + '"]');
  if (el) el.focus({ preventScroll: true });
}
function postStory(){
  state.posted = true;
  render();
  toast(t().posted);
}
function go(to){
  if (to === "story") openStory();
  else {
    /* 리빌에서 넘어올 때만 단계 공개를 연다. 스토리에서 돌아올 때는 이미 읽은 화면이다. */
    ARMED.reading = (state.view !== "reveal");
    state.view = "reading";
    render();
  }
}
function act(a){
  if (a === "start" || a === "redraw") startDraw();
  else if (a === "post") postStory();
}

/* =======================================================
   EVENTS
   ======================================================= */
views.addEventListener("click", function(e){
  const slide = e.target.closest("[data-slide]");
  if (slide){ slideBy(parseInt(slide.getAttribute("data-slide"), 10)); return; }
  if (e.target.closest("#bzPick")){ pickCard(); return; }
  const sel = e.target.closest("[data-sel]");
  if (sel){ setStorySel(sel.getAttribute("data-sel")); return; }
  const goBtn = e.target.closest("[data-go]");
  if (goBtn){ go(goBtn.getAttribute("data-go")); return; }
  const actBtn = e.target.closest("[data-act]");
  if (actBtn){ act(actBtn.getAttribute("data-act")); return; }
  /* 탭 한 번 = 지금 진행 중인 연출 전부 끝(단계별로 여러 번 탭하게 두지 않는다).
     리더의 말이 라이브로 써지는 중에도 같은 탭 한 번으로 끊긴다. */
  if (seqOn || typeTimer || liveSkipHook) seqSkip();
});

/* 탭이 뒤로 넘어가면 키프레임과 타이머가 서로 다른 속도로 흐른다 —
   단계가 표류하지 않게 그 자리에서 완주시킨다. 돌아오면 최종 상태만 남아 있다. */
document.addEventListener("visibilitychange", function(){
  if (document.hidden) seqSkip();
});

views.addEventListener("input", function(e){
  if (e.target && e.target.id === "stCapIn"){
    state.caption = e.target.value;
    state.capEdited = e.target.value.length > 0;
    const cap = $("stCap");
    if (cap) cap.textContent = state.caption;
  }
});

window.addEventListener("keydown", function(e){
  if (state.view !== "browse") return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); slideBy(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); slideBy(1); }
  else if (e.key === "Enter"){
    if (e.target && e.target.closest && e.target.closest("button")) return;
    e.preventDefault();
    pickCard();
  }
});

document.querySelectorAll("[data-lang-btn]").forEach(function(b){
  b.addEventListener("click", function(){
    /* 연출 도중에 화면을 다시 그리면 남은 단계가 갈 곳을 잃는다 — 먼저 완주시킨다.
       (세 번째 카드를 놓은 직후라면 이 한 줄이 리빌로 넘겨준다.) */
    seqSkip();
    state.lang = b.getAttribute("data-lang-btn");
    document.querySelectorAll("[data-lang-btn]").forEach(function(x){
      const on = x.getAttribute("data-lang-btn") === state.lang;
      x.classList.toggle("is-on", on);
      x.setAttribute("aria-pressed", on ? "true" : "false");
    });
    syncChrome();
    if (state.view === "story" && state.quint && !state.capEdited) state.caption = defaultCaption();
    render();
  });
});

/* =======================================================
   PHONE SCALING
   모바일에서는 화면이 뷰포트를 채우므로 스케일을 걸지 않는다(인라인 스타일도 비운다).
   데스크톱에서는 가로·세로 둘 다 보고 줄여서, 낮은 창에서도 폰이 통째로 들어온다.
   ======================================================= */
const stage = $("stage");
const phoneScale = $("phoneScale");
const MOBILE = window.matchMedia("(max-width:480px)");
function fitPhone(){
  if (MOBILE.matches){
    phoneScale.style.transform = "";
    stage.style.height = "";
    return;
  }
  const availW = stage.clientWidth;
  const availH = window.innerHeight - 32;   /* #app 상하 패딩 */
  const s = Math.min(1, availW / 400, availH / 844);
  phoneScale.style.transform = "scale(" + s + ")";
  stage.style.height = Math.round(844 * s) + "px";
}
window.addEventListener("resize", fitPhone);

/* =======================================================
   BOOT
   ======================================================= */
$("sbTime").textContent = jstClock();
setInterval(function(){ $("sbTime").textContent = jstClock(); }, 30000);
syncChrome();
render();
fitPhone();
setTimeout(fitPhone, 400);

})();
</script></body></html>
